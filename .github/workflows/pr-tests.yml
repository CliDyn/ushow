name: PR Tests

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  test-linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            make_flags: ""
            run_tests: "true"
          - name: zarr-only
            make_flags: "WITH_ZARR=1"
            run_tests: "false"
          - name: grib-only
            make_flags: "WITH_GRIB=1"
            run_tests: "false"
          - name: zarr-and-grib
            make_flags: "WITH_ZARR=1 WITH_GRIB=1"
            run_tests: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnetcdf-dev \
            libblosc-dev \
            liblz4-dev \
            libeccodes-dev \
            libx11-dev \
            libxt-dev \
            libxaw7-dev \
            libxmu-dev \
            libxext-dev \
            libxpm-dev \
            pkg-config

      - name: Build
        run: |
          make clean
          make ${{ matrix.make_flags }} -j"$(nproc)"

      - name: Run tests
        if: matrix.run_tests == 'true'
        run: make ${{ matrix.make_flags }} test

  test-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew install netcdf c-blosc lz4 eccodes
          brew install --cask xquartz  # provides X11 at /opt/X11

      - name: Build
        run: |
          ls /opt/X11/include/X11/ | head -5 || echo "/opt/X11/include/X11 not found"
          make clean
          make X11_PREFIX=/opt/X11 WITH_GRIB=1 WITH_ZARR=1 -j"$(sysctl -n hw.ncpu)"

      - name: Run tests
        run: make X11_PREFIX=/opt/X11 WITH_GRIB=1 WITH_ZARR=1 test
