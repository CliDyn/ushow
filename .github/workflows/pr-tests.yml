name: PR Tests

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  test-linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            make_flags: ""
            run_tests: "true"
          - name: zarr-only
            make_flags: "WITH_ZARR=1"
            run_tests: "false"
          - name: grib-only
            make_flags: "WITH_GRIB=1"
            run_tests: "false"
          - name: zarr-and-grib
            make_flags: "WITH_ZARR=1 WITH_GRIB=1"
            run_tests: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnetcdf-dev \
            libblosc-dev \
            liblz4-dev \
            libeccodes-dev \
            libx11-dev \
            libxt-dev \
            libxaw7-dev \
            libxmu-dev \
            libxext-dev \
            libxpm-dev \
            pkg-config

      - name: Build
        run: |
          make clean
          make ${{ matrix.make_flags }} -j"$(nproc)"

      - name: Run tests
        if: matrix.run_tests == 'true'
        run: make ${{ matrix.make_flags }} test

  test-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew install netcdf c-blosc lz4 eccodes libxaw libxt libx11 libxmu libxext xorgproto
          # Homebrew X11 packages install .pc files in per-package prefixes;
          # collect them into PKG_CONFIG_PATH for subsequent steps
          PKG_DIRS=""
          for pkg in libxaw libxt libx11 libxmu libxext libxcb libsm libice; do
            dir="$(brew --prefix $pkg 2>/dev/null)/lib/pkgconfig"
            [ -d "$dir" ] && PKG_DIRS="${PKG_DIRS:+$PKG_DIRS:}$dir"
          done
          dir="$(brew --prefix xorgproto 2>/dev/null)/share/pkgconfig"
          [ -d "$dir" ] && PKG_DIRS="${PKG_DIRS:+$PKG_DIRS:}$dir"
          echo "X11_PKG_CONFIG_PATH=$PKG_DIRS" >> "$GITHUB_ENV"

      - name: Build
        run: |
          export PKG_CONFIG_PATH="${X11_PKG_CONFIG_PATH}:${PKG_CONFIG_PATH:-}"
          pkg-config --cflags x11 xt xaw7  # verify X11 detection
          make clean
          make WITH_GRIB=1 WITH_ZARR=1 -j"$(sysctl -n hw.ncpu)"

      - name: Run tests
        run: |
          export PKG_CONFIG_PATH="${X11_PKG_CONFIG_PATH}:${PKG_CONFIG_PATH:-}"
          make WITH_GRIB=1 WITH_ZARR=1 test
